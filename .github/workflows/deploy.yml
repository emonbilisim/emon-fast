      - name: Patch backend (talep gorselleri — RFQ referans gorselleri)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/emonfast
            set -a; . ./.env; set +a
            # 8a) DDL: satir-basina-bir-gorsel tablosu. Base64 gorsel ana /api/veri blobuna
            #     GIRMEZ (blob sismesin + her kayitta yeniden upload olmasin) — kase/formlar
            #     ile ayni gerekce. talep_no ile RFQ ekranindan toplu cekilir.
            PGPASSWORD="$DB_PASS" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 <<'SQL'
            CREATE TABLE IF NOT EXISTS talep_gorseller (
              id TEXT PRIMARY KEY,
              talep_no TEXT,
              data JSONB NOT NULL,
              olusturma TIMESTAMPTZ DEFAULT NOW()
            );
            CREATE INDEX IF NOT EXISTS talep_gorseller_talep_no_idx ON talep_gorseller (talep_no);
            SQL
            # 8b) Route enjeksiyonu (idempotent): GET /api/talep-gorseller/:talepNo +
            #     GET /api/talep-gorsel/:id + PUT /api/talep-gorsel + DELETE /api/talep-gorsel/:id
            cat > /tmp/emon-patch-tg.js << 'PATCH'
            const fs = require('fs');
            const f = '/var/www/emonfast/server.js';
            let s = fs.readFileSync(f, 'utf8');
            let degisti = false;
            const yedek = () => { if (!degisti) fs.writeFileSync(f + '.bak.ci-tg', s); };
            const tgRoute =
              "app.get('/api/talep-gorseller/:talepNo', authMiddleware, async (req, res) => { // talep-gorsel v1\n" +
              "  try {\n" +
              "    const r = await pool.query('SELECT data FROM talep_gorseller WHERE talep_no=$1 ORDER BY olusturma', [String(req.params.talepNo)]);\n" +
              "    res.json({ ok: true, gorseller: r.rows.map(x => x.data) });\n" +
              "  } catch (e) { res.status(500).json({ ok: false, hata: e.message }); }\n" +
              "});\n" +
              "app.get('/api/talep-gorsel/:id', authMiddleware, async (req, res) => { // talep-gorsel v1\n" +
              "  try {\n" +
              "    const r = await pool.query('SELECT data FROM talep_gorseller WHERE id=$1', [String(req.params.id)]);\n" +
              "    if (!r.rows.length) return res.status(404).json({ ok: false, hata: 'gorsel yok' });\n" +
              "    res.json({ ok: true, gorsel: r.rows[0].data });\n" +
              "  } catch (e) { res.status(500).json({ ok: false, hata: e.message }); }\n" +
              "});\n" +
              "app.put('/api/talep-gorsel', authMiddleware, async (req, res) => { // talep-gorsel v1\n" +
              "  try {\n" +
              "    const g = (req.body && typeof req.body === 'object') ? req.body : {};\n" +
              "    if (!g.id) return res.status(400).json({ ok: false, hata: 'id gerekli' });\n" +
              "    await pool.query('INSERT INTO talep_gorseller (id, talep_no, data) VALUES ($1,$2,$3) ON CONFLICT (id) DO UPDATE SET talep_no=$2, data=$3', [String(g.id), g.talepNo ? String(g.talepNo) : null, JSON.stringify(g)]);\n" +
              "    res.json({ ok: true });\n" +
              "  } catch (e) { res.status(500).json({ ok: false, hata: e.message }); }\n" +
              "});\n" +
              "app.delete('/api/talep-gorsel/:id', authMiddleware, async (req, res) => { // talep-gorsel v1\n" +
              "  try {\n" +
              "    await pool.query('DELETE FROM talep_gorseller WHERE id=$1', [String(req.params.id)]);\n" +
              "    res.json({ ok: true });\n" +
              "  } catch (e) { res.status(500).json({ ok: false, hata: e.message }); }\n" +
              "});\n";
            if (s.includes('// talep-gorsel v1')) {
              console.log('talep-gorsel route zaten var');
            } else if (s.includes("app.get('/api/saglik'")) {
              yedek();
              s = s.replace("app.get('/api/saglik'", tgRoute + "\napp.get('/api/saglik'");
              degisti = true;
              console.log('talep-gorsel route eklendi');
            } else {
              console.log('UYARI: /api/saglik bulunamadi, talep-gorsel eklenemedi');
            }
            if (degisti) fs.writeFileSync(f, s); else console.log('server.js (patch-tg) zaten guncel');
            PATCH
            node /tmp/emon-patch-tg.js

      - name: Patch backend (tahsilat — alacak/dunning takibi)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/emonfast
            set -a; . ./.env; set +a
            # 9a) DDL: satir-basina-bir-alacak tablosu (JSONB). Her kayit bagimsiz
            #     upsert/delete edilir; dizi-clobber riski yok. id = istemci uid (TEXT).
            PGPASSWORD="$DB_PASS" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 <<'SQL'
            CREATE TABLE IF NOT EXISTS tahsilat (
              id TEXT PRIMARY KEY,
              data JSONB NOT NULL,
              guncelleme TIMESTAMPTZ DEFAULT NOW()
            );
            SQL
            # 9b) Route enjeksiyonu (idempotent): GET/PUT /api/tahsilat + DELETE /api/tahsilat/:id
            cat > /tmp/emon-patch-tah.js << 'PATCH'
            const fs = require('fs');
            const f = '/var/www/emonfast/server.js';
            let s = fs.readFileSync(f, 'utf8');
            let degisti = false;
            const yedek = () => { if (!degisti) fs.writeFileSync(f + '.bak.ci-tah', s); };
            const tahRoute =
              "app.get('/api/tahsilat', authMiddleware, async (req, res) => { // tahsilat v1\n" +
              "  try {\n" +
              "    const r = await pool.query('SELECT data FROM tahsilat ORDER BY guncelleme DESC');\n" +
              "    res.json({ ok: true, kayitlar: r.rows.map(x => x.data) });\n" +
              "  } catch (e) { res.status(500).json({ ok: false, hata: e.message }); }\n" +
              "});\n" +
              "app.put('/api/tahsilat', authMiddleware, async (req, res) => { // tahsilat v1\n" +
              "  try {\n" +
              "    const k = (req.body && typeof req.body === 'object') ? req.body : {};\n" +
              "    if (!k.id) return res.status(400).json({ ok: false, hata: 'id gerekli' });\n" +
              "    await pool.query('INSERT INTO tahsilat (id, data, guncelleme) VALUES ($1,$2,NOW()) ON CONFLICT (id) DO UPDATE SET data=$2, guncelleme=NOW()', [String(k.id), JSON.stringify(k)]);\n" +
              "    res.json({ ok: true });\n" +
              "  } catch (e) { res.status(500).json({ ok: false, hata: e.message }); }\n" +
              "});\n" +
              "app.delete('/api/tahsilat/:id', authMiddleware, async (req, res) => { // tahsilat v1\n" +
              "  try {\n" +
              "    await pool.query('DELETE FROM tahsilat WHERE id=$1', [String(req.params.id)]);\n" +
              "    res.json({ ok: true });\n" +
              "  } catch (e) { res.status(500).json({ ok: false, hata: e.message }); }\n" +
              "});\n";
            if (s.includes('// tahsilat v1')) {
              console.log('tahsilat route zaten var');
            } else if (s.includes("app.get('/api/saglik'")) {
              yedek();
              s = s.replace("app.get('/api/saglik'", tahRoute + "\napp.get('/api/saglik'");
              degisti = true;
              console.log('tahsilat route eklendi');
            } else {
              console.log('UYARI: /api/saglik bulunamadi, tahsilat eklenemedi');
            }
            if (degisti) fs.writeFileSync(f, s); else console.log('server.js (patch-tah) zaten guncel');
            PATCH
            node /tmp/emon-patch-tah.js

      - name: Patch backend (veri-delta — talep basina yazim, 10 MB govde duvarini kaldirir)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/emonfast
            set -a; . ./.env; set +a
            # d1) data->>'no' uzerinde arama indeksi. UNIQUE DEGIL: mukerrer no varsa
            #     olusturma patlamasin (delta zaten mukerrer no gorunce devreye girmez).
            PGPASSWORD="$DB_PASS" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 <<'SQL'
            CREATE INDEX IF NOT EXISTS talepler_no_idx ON talepler ((data->>'no'));
            SQL
            echo "--- talepler semasi (tani: INSERT (data) yeterli mi?) ---"
            PGPASSWORD="$DB_PASS" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -c "\d talepler" || true
            # d2) Route enjeksiyonu (idempotent): POST /api/veri-delta
            cat > /tmp/emon-patch-delta.js << 'PATCH'
            const fs = require('fs');
            const f = '/var/www/emonfast/server.js';
            let s = fs.readFileSync(f, 'utf8');
            if (s.includes('// veri-delta v2')) { console.log('veri-delta v2 zaten var'); process.exit(0); }
            const deltaRoute =
              "app.post('/api/veri-delta', authMiddleware, async (req, res) => { // veri-delta v2\n" +
              "  // POST /api/veri her kayitta TUM talepleri + teklif blobunu gonderiyordu (full-replace).\n" +
              "  // Govde talep sayisiyla buyuyup ~10 MB sinirina dayaninca 413 ile HERKES icin yazma olur.\n" +
              "  // Bu route yalniz DEGISENI yazar; sonuc full-replace ile ayni, govde degisiklik kadar.\n" +
              "  if (!req.body || !req.body._build) return res.status(409).json({ hata: 'stale-client', reload: true });\n" +
              "  const upsert = Array.isArray(req.body.upsert) ? req.body.upsert : [];\n" +
              "  const sil    = Array.isArray(req.body.sil) ? req.body.sil : [];\n" +
              "  const kasten = !!req.body.kasten;\n" +
              "  const tk     = (req.body.teklifler && typeof req.body.teklifler === 'object') ? req.body.teklifler : null;\n" +
              "  if (upsert.length > 2000 || sil.length > 2000) return res.status(400).json({ hata: 'delta cok buyuk' });\n" +
              "  const client = await pool.connect();\n" +
              "  try {\n" +
              "    await client.query('BEGIN');\n" +
              "    const cur = (await client.query('SELECT count(*)::int AS n FROM talepler')).rows[0].n;\n" +
              "    // veri-guard esdegeri: tek yazimda satirlarin yarisindan fazlasi silinemez\n" +
              "    if (!kasten && cur >= 4 && sil.length > cur * 0.5) {\n" +
              "      await client.query('ROLLBACK');\n" +
              "      console.warn('[veri-delta] ' + sil.length + '/' + cur + ' silme REDDEDILDI');\n" +
              "      return res.status(409).json({ hata: 'toplu-silme-reddedildi', mevcut: cur, silinecek: sil.length });\n" +
              "    }\n" +
              "    let yeni = 0, guncel = 0, silindi = 0, tkYazilan = 0, tkSilinen = 0;\n" +
              "    for (const t of upsert) {\n" +
              "      if (!t || t.no == null) continue;\n" +
              "      const r = await client.query(\"UPDATE talepler SET data=$2 WHERE data->>'no'=$1\", [String(t.no), JSON.stringify(t)]);\n" +
              "      if (r.rowCount) guncel += r.rowCount;\n" +
              "      else { await client.query('INSERT INTO talepler (data) VALUES ($1)', [JSON.stringify(t)]); yeni++; }\n" +
              "    }\n" +
              "    for (const no of sil) {\n" +
              "      if (no == null) continue;\n" +
              "      const r = await client.query(\"DELETE FROM talepler WHERE data->>'no'=$1\", [String(no)]);\n" +
              "      silindi += r.rowCount;\n" +
              "    }\n" +
              "    if (tk) {\n" +
              "      // talepTeklifleri: 'ayarlar' tablosunda TEK JSONB satiri. DEPOLAMA SEKLI AYNI kaliyor,\n" +
              "      // kucululen sey HTTP govdesi: sunucu mevcut blobu okur, silinecek anahtarlari duser,\n" +
              "      // degisenleri uzerine merge eder ve butun halinde geri yazar (ayni transaction icinde).\n" +
              "      const up = (tk.upsert && typeof tk.upsert === 'object') ? tk.upsert : {};\n" +
              "      const sl = Array.isArray(tk.sil) ? tk.sil : [];\n" +
              "      const _r = await client.query(\"SELECT deger FROM ayarlar WHERE anahtar='teklifler'\");\n" +
              "      const curObj = (_r.rows[0] && _r.rows[0].deger) || {};\n" +
              "      const curN = Object.keys(curObj).length;\n" +
              "      if (!kasten && curN >= 4 && sl.length > curN * 0.5) {\n" +
              "        await client.query('ROLLBACK');\n" +
              "        console.warn('[veri-delta] teklifler ' + sl.length + '/' + curN + ' silme REDDEDILDI');\n" +
              "        return res.status(409).json({ hata: 'teklif-toplu-silme-reddedildi', mevcut: curN, silinecek: sl.length });\n" +
              "      }\n" +
              "      const birlesik = Object.assign({}, curObj);\n" +
              "      for (const k of sl) delete birlesik[k];\n" +
              "      Object.assign(birlesik, up);\n" +
              "      if (_r.rowCount) await client.query(\"UPDATE ayarlar SET deger=$1::jsonb WHERE anahtar='teklifler'\", [JSON.stringify(birlesik)]);\n" +
              "      else await client.query(\"INSERT INTO ayarlar (anahtar, deger) VALUES ('teklifler', $1::jsonb)\", [JSON.stringify(birlesik)]);\n" +
              "      tkYazilan = Object.keys(up).length; tkSilinen = sl.length;\n" +
              "    }\n" +
              "    await client.query('COMMIT');\n" +
              "    res.json({ ok: true, surum: 2, yeni, guncel, silindi, tkYazilan, tkSilinen, mevcut: cur });\n" +
              "  } catch (e) {\n" +
              "    try { await client.query('ROLLBACK'); } catch (_) {}\n" +
              "    console.warn('[veri-delta] hata: ' + e.message);\n" +
              "    res.status(500).json({ ok: false, hata: e.message });\n" +
              "  } finally { client.release(); }\n" +
              "});\n";
            fs.writeFileSync(f + '.bak.delta', s);
            const bas = s.indexOf("app.post('/api/veri-delta'");
            if (bas >= 0) {
              // v1 route'u yerinde duruyor: suslu parantez esleyerek TAM sinirlarini bul ve degistir.
              // (Metni birebir yeniden uretmeye calismak kirilgan olurdu.)
              let d = 0, son = -1;
              for (let k = s.indexOf('{', bas); k < s.length; k++) {
                if (s[k] === '{') d++;
                else if (s[k] === '}') { d--; if (!d) { son = k; break; } }
              }
              if (son < 0 || s.slice(son + 1, son + 3) !== ');') {
                console.log('UYARI: v1 route sinirlari cozulemedi — DEGISIKLIK YAPILMADI'); process.exit(0);
              }
              s = s.slice(0, bas) + deltaRoute + s.slice(son + 3);
              console.log('veri-delta v1 -> v2 guncellendi');
            } else if (s.includes("app.get('/api/saglik'")) {
              s = s.replace("app.get('/api/saglik'", deltaRoute + "\napp.get('/api/saglik'");
              console.log('veri-delta v2 eklendi');
            } else {
              console.log('UYARI: /api/saglik bulunamadi, veri-delta EKLENMEDI'); process.exit(0);
            }
            fs.writeFileSync(f, s);
            PATCH
            node /tmp/emon-patch-delta.js

      - name: Patch backend (veri-etag — GET /api/veri degismediyse 304, govde hic gitmez)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cat > /tmp/emon-patch-etag.js << 'PATCH'
            const fs = require('fs');
            const f = '/var/www/emonfast/server.js';
            let s = fs.readFileSync(f, 'utf8');
            if (s.includes('// veri-etag v1')) { console.log('veri-etag zaten var'); process.exit(0); }
            const cipa = "app.get('/api/veri'";
            if (!s.includes(cipa)) { console.log('UYARI: app.get(/api/veri) bulunamadi, veri-etag EKLENMEDI'); process.exit(0); }
            const mw =
              "app.use('/api/veri', (req, res, next) => { // veri-etag v1\n" +
              "  // GET /api/veri her cagrida TUM blobu (MB'larca) gonderiyor; istemci ayrica 45 sn'de\n" +
              "  // bir yokluyor ve her kayittan once bir kez daha cekiyor. Govde DEGISMEDIYSE 304 don:\n" +
              "  // tek bayt govde gitmez. ETag govdenin HASH'i oldugundan 'degismedi' hukmu tanim geregi\n" +
              "  // dogru — elle guncellenen bir surum sayaci gibi bayat kalamaz.\n" +
              "  // Not: app.use('/api/veri') on-eki /api/veri-delta ile ESLESMEZ (Express sinir olarak '/' arar).\n" +
              "  if (req.method !== 'GET') return next();\n" +
              "  const orij = res.json.bind(res);\n" +
              "  res.json = (govde) => {\n" +
              "    try {\n" +
              "      const metin = JSON.stringify(govde);\n" +
              "      const etag = '\"vd1-' + require('crypto').createHash('sha1').update(metin).digest('hex') + '\"';\n" +
              "      res.set('ETag', etag);\n" +
              "      res.set('Cache-Control', 'no-cache');\n" +
              "      // nginx gzip'lerken guclu ETag'i zayiflatabilir (W/\"...\") — karsilastirmadan once soy.\n" +
              "      const gelen = String(req.headers['if-none-match'] || '').replace(/^W\\//, '');\n" +
              "      if (gelen && gelen === etag) return res.status(304).end();\n" +
              "      return res.type('application/json').send(metin);\n" +
              "    } catch (e) { return orij(govde); }\n" +
              "  };\n" +
              "  next();\n" +
              "});\n";
            fs.writeFileSync(f + '.bak.etag', s);
            s = s.replace(cipa, mw + "\n" + cipa);
            fs.writeFileSync(f, s);
            console.log('veri-etag v1 eklendi');
            PATCH
            node /tmp/emon-patch-etag.js

      - name: Rename and restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mv /var/www/emonfast/public/satin_alma_acentesi.html /var/www/emonfast/public/index.html
            cd /var/www/emonfast
            pm2 restart emonfast

      # Perf: nginx gzip sıkıştırma seviyesini yükselt (varsayılan ~1 → 5).
      # index.html ~399 KB → ~345 KB. Idempotent + nginx -t korumalı + otomatik geri-alma.
      # nginx -t başarısızsa yedeği geri yükler; siteyi asla bozmaz.
      - name: Nginx gzip seviyesi (perf)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            f=/etc/nginx/nginx.conf
            ts=$(date +%s); cp "$f" "$f.bak.$ts"
            if grep -qE '^[[:space:]]*gzip_comp_level' "$f"; then
              sed -i -E 's/^[[:space:]]*gzip_comp_level.*/    gzip_comp_level 5;/' "$f"
              echo "gzip_comp_level -> 5 (mevcut satir guncellendi)"
            elif grep -qE '^[[:space:]]*gzip on;' "$f"; then
              sed -i -E '0,/^[[:space:]]*gzip on;/s//    gzip on;\n    gzip_comp_level 5;\n    gzip_vary on;\n    gzip_min_length 1024;/' "$f"
              echo "gzip_comp_level 5 + gzip_vary + gzip_min_length eklendi (gzip on; sonrasi)"
            else
              sed -i -E '0,/^[[:space:]]*http[[:space:]]*\{/s//http {\n    gzip_comp_level 5;\n    gzip_vary on;\n    gzip_min_length 1024;/' "$f"
              echo "gzip direktifleri http blogu basina eklendi"
            fi
            # gzip_types: nginx VARSAYILANI yalniz text/html'dir → /api/veri'nin MB'larca
            # JSON govdesi SIKISTIRILMADAN gidiyordu. application/json eklenince ~10x kuculur.
            if grep -qE '^[[:space:]]*gzip_types' "$f"; then
              if grep -qE '^[[:space:]]*gzip_types[^;]*application/json' "$f"; then
                echo "gzip_types zaten application/json iceriyor"
              else
                sed -i -E 's#^([[:space:]]*gzip_types[^;]*);#\1 application/json;#' "$f"
                echo "gzip_types -> application/json eklendi"
              fi
            elif grep -qE '^[[:space:]]*gzip_comp_level' "$f"; then
              sed -i -E '0,/^[[:space:]]*gzip_comp_level.*/s##&\n    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;#' "$f"
              echo "gzip_types satiri eklendi (gzip_comp_level sonrasi)"
            else
              echo "UYARI: gzip_comp_level bulunamadi, gzip_types eklenemedi"
            fi
            if nginx -t 2>&1; then
              systemctl reload nginx && echo "OK: nginx reload edildi (gzip level 5 + json)"
            else
              echo "HATA: nginx -t basarisiz — yedek geri yukleniyor"
              cp "$f.bak.$ts" "$f"; nginx -t && systemctl reload nginx
              echo "GERI ALINDI: onceki nginx.conf yuklendi"
            fi

      - name: WireGuard peer ekle (client6, client7)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            CONF=/etc/wireguard/wg0.conf
            if ! command -v wg >/dev/null 2>&1; then echo "ATLANDI: wireguard kurulu degil"; exit 0; fi
            if [ ! -f "$CONF" ]; then echo "ATLANDI: $CONF yok"; exit 0; fi
            ts=$(date +%s); cp "$CONF" "$CONF.bak.$ts"
            degisti=0
            peer_ekle() {
              AD="$1"; PUB="$2"; IP="$3"
              if grep -qF "$PUB" "$CONF"; then echo "ZATEN-VAR: $AD ($IP)"; return; fi
              if grep -qE "AllowedIPs[[:space:]]*=[[:space:]]*$IP/32" "$CONF"; then
                echo "HATA: $IP zaten baska bir peer'de kullaniliyor — $AD EKLENMEDI"; return
              fi
              printf '\n[Peer]\n# %s\nPublicKey = %s\nAllowedIPs = %s/32\n' "$AD" "$PUB" "$IP" >> "$CONF"
              wg set wg0 peer "$PUB" allowed-ips "$IP/32" && echo "EKLENDI (canli): $AD -> $IP" || echo "EKLENDI (yalniz conf, wg0 kapali): $AD -> $IP"
              degisti=1
            }
            peer_ekle client6 "QtzXZ7bIiaLNd6VfYc/Q+vy6giiDlhNyE9dMeuOF6ws=" 10.0.0.7
            peer_ekle client7 "ZqSev3n5bbNuXCzRdhAdX/HwXbr1/AjMT1rTa3QUGVg=" 10.0.0.8
            [ "$degisti" = "0" ] && rm -f "$CONF.bak.$ts"
            echo "--- wg0 peer / allowed-ips ---"
            wg show wg0 allowed-ips 2>/dev/null || echo "(wg0 arayuzu su an kapali)"
