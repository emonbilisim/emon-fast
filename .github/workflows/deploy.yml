      - name: Patch backend (sistem-durum — disk/DB kapasitesi, admin-only)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cat > /tmp/emon-patch-sistem.js << 'PATCH'
            const fs = require('fs');
            const f = '/var/www/emonfast/server.js';
            let s = fs.readFileSync(f, 'utf8');
            if (s.includes('// sistem-durum v1')) { console.log('sistem-durum zaten var'); process.exit(0); }
            const route =
              "app.get('/api/sistem/durum', authMiddleware, async (req, res) => { // sistem-durum v1\n" +
              "  try {\n" +
              "    if (!req.kullanici || req.kullanici.rol !== 'admin') return res.status(403).json({ ok: false, hata: 'yalniz admin' });\n" +
              "    let disk = null;\n" +
              "    try {\n" +
              "      const out = require('child_process').execSync('df -kP /', { encoding: 'utf8' }).trim().split('\\n');\n" +
              "      const c = out[out.length - 1].split(/\\s+/);\n" +
              "      const toplam = Number(c[1]) * 1024, kullanilan = Number(c[2]) * 1024, bos = Number(c[3]) * 1024;\n" +
              "      disk = { toplam, kullanilan, bos, yuzde: toplam ? Math.round(kullanilan / toplam * 100) : 0 };\n" +
              "    } catch (e) { disk = { hata: e.message }; }\n" +
              "    let db = null;\n" +
              "    try { const r = await pool.query('SELECT pg_database_size(current_database()) AS b'); db = { boyut: Number(r.rows[0].b) }; } catch (e) { db = { hata: e.message }; }\n" +
              "    res.json({ ok: true, disk, db, zaman: new Date().toISOString() });\n" +
              "  } catch (e) { res.status(500).json({ ok: false, hata: e.message }); }\n" +
              "});\n";
            if (!s.includes("app.get('/api/saglik'")) { console.log('UYARI: /api/saglik bulunamadi, sistem-durum eklenemedi'); process.exit(0); }
            fs.writeFileSync(f + '.bak.sistem', s);
            s = s.replace("app.get('/api/saglik'", route + "\napp.get('/api/saglik'");
            fs.writeFileSync(f, s);
            console.log('sistem-durum route eklendi');
            PATCH
            node /tmp/emon-patch-sistem.js

      - name: Patch backend (veri-guard — katastrofik tablo kaybi korumasi)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -f /var/www/emonfast/public/_hdump_k7x9q.txt
            cat > /tmp/emon-patch-guard.js << 'PATCH'
            const fs = require('fs');
            const f = '/var/www/emonfast/server.js';
            let s = fs.readFileSync(f, 'utf8');
            if (s.includes('veri-guard v1')) { console.log('veri-guard zaten var'); process.exit(0); }
            const anchor = "    const { MUSTERILER, TEDARIKCILER, TALEPLER, AYARLAR, talepTeklifleri, ONAY_BEKLEYENLER } = req.body;";
            if (!s.includes(anchor)) { console.log('UYARI: anchor bulunamadi, veri-guard EKLENMEDI'); process.exit(0); }
            const guard = [
            "    // veri-guard v1 — stale/bug istemcinin full-replace ile tabloyu katastrofik",
            "    // bosaltmasini/kucultmesini engelle. >=4 satirlik tabloda tek yazimda satirlarin",
            "    // yarisindan FAZLASI kaybolacaksa (kasitli bayrak yoksa) o koleksiyon KORUNUR.",
            "    // talepTeklifleri blobu katastrofik anahtar kaybinda sunucu verisiyle birlestirilir.",
            "    try {",
            "      const _kt = [['MUSTERILER','musteriler','musterilerKasten'],['TEDARIKCILER','tedarikciler','tedarikcilerKasten'],['TALEPLER','talepler','taleplerKasten']];",
            "      for (const _row of _kt) {",
            "        const alan = _row[0], tablo = _row[1], bayrak = _row[2];",
            "        const gelen = req.body[alan];",
            "        if (!Array.isArray(gelen) || !gelen.length) continue;",
            "        const cur = (await client.query('SELECT count(*)::int AS n FROM ' + tablo)).rows[0].n;",
            "        if (cur >= 4 && gelen.length < cur * 0.5 && !req.body[bayrak]) {",
            "          console.warn('[veri-guard] ' + tablo + ': gelen ' + gelen.length + ' < mevcut ' + cur + ' — KORUNDU');",
            "          req.body[alan] = undefined;",
            "        }",
            "      }",
            "      if (req.body.talepTeklifleri && typeof req.body.talepTeklifleri === 'object') {",
            "        const inN = Object.keys(req.body.talepTeklifleri).length;",
            "        const _r = await client.query(\"SELECT deger FROM ayarlar WHERE anahtar='teklifler'\");",
            "        const curObj = (_r.rows[0] && _r.rows[0].deger) || {};",
            "        const curN = Object.keys(curObj).length;",
            "        if (curN >= 4 && inN < curN * 0.5) {",
            "          req.body.talepTeklifleri = Object.assign({}, curObj, req.body.talepTeklifleri);",
            "          console.warn('[veri-guard] teklifler: gelen ' + inN + ' < mevcut ' + curN + ' — BIRLESTIRILDI');",
            "        }",
            "      }",
            "    } catch (_g) { console.warn('[veri-guard] hata: ' + _g.message); }",
            ""
            ].join('\n');
            fs.writeFileSync(f + '.bak.guard', s);
            s = s.replace(anchor, guard + anchor);
            fs.writeFileSync(f, s);
            console.log('veri-guard v1 eklendi');
            PATCH
            node /tmp/emon-patch-guard.js

      - name: Patch backend (build-guard — eski/damgasiz istemci yazimini reddet)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cat > /tmp/emon-patch-build.js << 'PATCH'
            const fs = require('fs');
            const f = '/var/www/emonfast/server.js';
            let s = fs.readFileSync(f, 'utf8');
            if (s.includes('build-guard v1')) { console.log('build-guard zaten var'); process.exit(0); }
            // POST /api/veri'ye build damgasi zorunlulugu: damgasiz (eski/onbellekli kod)
            // istemcilerin eski merge mantigiyla ortak veriyi bozmasini SUNUCU seviyesinde engelle.
            const anchor = "app.post('/api/veri', authMiddleware, async (req, res) => {\n  const client = await pool.connect();";
            if (!s.includes(anchor)) { console.log('UYARI: build-guard anchor bulunamadi, EKLENMEDI'); process.exit(0); }
            const replacement = "app.post('/api/veri', authMiddleware, async (req, res) => {\n"
              + "  // build-guard v1 — damgasiz (eski/onbellekli) istemci yazimini reddet\n"
              + "  if (!req.body || !req.body._build) { return res.status(409).json({ hata: 'stale-client', reload: true }); }\n"
              + "  const client = await pool.connect();";
            fs.writeFileSync(f + '.bak.build', s);
            s = s.replace(anchor, replacement);
            fs.writeFileSync(f, s);
            console.log('build-guard v1 eklendi');
            PATCH
            node /tmp/emon-patch-build.js

