name: EMON Fast Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Backup current index.html
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cp /var/www/emonfast/public/index.html /var/www/emonfast/public/index.html.bak

      - name: Upload HTML
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "satin_alma_acentesi.html"
          target: "/var/www/emonfast/public/"
          strip_components: 0

      - name: Patch backend (bos dizi tablo silme korumasi)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cat > /tmp/emon-patch.js << 'PATCH'
            const fs = require('fs');
            const f = '/var/www/emonfast/server.js';
            let s = fs.readFileSync(f, 'utf8');
            let degisti = false;
            const yedek = () => { if (!degisti) fs.writeFileSync(f + '.bak.ci', s); };
            // 1) Bos dizi tablo silme korumasi
            if (s.includes('if (MUSTERILER) {') || s.includes('if (TEDARIKCILER) {')) {
              yedek();
              s = s.replace('if (MUSTERILER) {', 'if (Array.isArray(MUSTERILER) && MUSTERILER.length) {');
              s = s.replace('if (TEDARIKCILER) {', 'if (Array.isArray(TEDARIKCILER) && TEDARIKCILER.length) {');
              degisti = true;
              console.log('server.js dizi-koruma yamalandi');
            }
            // 1b) TALEPLER bos dizi koruması (ayrı blok — MUSTERILER/TEDARIKCILER zaten
            //     yamali oldugundan yukaridaki kosul artik calismaz). Bos []/eksik gelince
            //     DELETE FROM talepler ile tum talepleri silmeyi engeller.
            if (s.includes('if (TALEPLER) {')) {
              yedek();
              s = s.replace('if (TALEPLER) {', 'if (Array.isArray(TALEPLER) && TALEPLER.length) {');
              degisti = true;
              console.log('server.js TALEPLER dizi-koruma yamalandi');
            } else {
              console.log('TALEPLER guard: zaten yamali ya da pattern (if (TALEPLER) {) bulunamadi');
            }
            // 2) DELETE /api/kullanicilar/:id (v2) — referanslari NULL'a cekip
            //    (musteri/tedarikci/talep verisi KORUNUR) pasif kullaniciyi siler.
            const yeniRoute =
              "app.delete('/api/kullanicilar/:id', authMiddleware, async (req, res) => { // kullanici-sil v2\n" +
              "  if (req.kullanici.rol !== 'admin') return res.status(403).json({ hata: 'Yetkisiz' });\n" +
              "  if (String(req.kullanici.id) === String(req.params.id)) return res.status(400).json({ hata: 'Kendi hesabinizi silemezsiniz' });\n" +
              "  const id = req.params.id;\n" +
              "  const client = await pool.connect();\n" +
              "  try {\n" +
              "    await client.query('BEGIN');\n" +
              "    await client.query('UPDATE musteriler SET olusturan_id=NULL WHERE olusturan_id=$1', [id]);\n" +
              "    await client.query('UPDATE tedarikciler SET olusturan_id=NULL WHERE olusturan_id=$1', [id]);\n" +
              "    await client.query('UPDATE talepler SET olusturan_id=NULL WHERE olusturan_id=$1', [id]);\n" +
              "    await client.query('UPDATE audit_log SET kullanici_id=NULL WHERE kullanici_id=$1', [id]);\n" +
              "    const r = await client.query(\"DELETE FROM kullanicilar WHERE id=$1 AND durum='Pasif'\", [id]);\n" +
              "    if (!r.rowCount) { await client.query('ROLLBACK'); return res.status(400).json({ hata: 'Yalnizca pasif kullanici kalici silinebilir' }); }\n" +
              "    await client.query('COMMIT');\n" +
              "    res.json({ ok: true });\n" +
              "  } catch (e) {\n" +
              "    try { await client.query('ROLLBACK'); } catch (_) {}\n" +
              "    res.status(500).json({ hata: 'Silme hatasi: ' + e.message });\n" +
              "  } finally {\n" +
              "    client.release();\n" +
              "  }\n" +
              "});\n";
            const eskiRoute =
              "app.delete('/api/kullanicilar/:id', authMiddleware, async (req, res) => {\n" +
              "  if (req.kullanici.rol !== 'admin') return res.status(403).json({ hata: 'Yetkisiz' });\n" +
              "  if (String(req.kullanici.id) === String(req.params.id)) return res.status(400).json({ hata: 'Kendi hesabinizi silemezsiniz' });\n" +
              "  const r = await pool.query(\"DELETE FROM kullanicilar WHERE id=$1 AND durum='Pasif'\", [req.params.id]);\n" +
              "  if (!r.rowCount) return res.status(400).json({ hata: 'Yalnizca pasif kullanici kalici silinebilir' });\n" +
              "  res.json({ ok: true });\n" +
              "});\n";
            if (s.includes('// kullanici-sil v2')) {
              console.log('kullanici-sil route zaten v2');
            } else if (s.includes(eskiRoute)) {
              yedek();
              s = s.replace(eskiRoute, yeniRoute);
              degisti = true;
              console.log('kullanici-sil route v2 ile guncellendi');
            } else if (s.includes("app.get('/api/saglik'")) {
              yedek();
              s = s.replace("app.get('/api/saglik'", yeniRoute + "\napp.get('/api/saglik'");
              degisti = true;
              console.log('kullanici-sil route v2 eklendi');
            }
            // 3) POST /api/giris-ms — Microsoft 365 SSO koprusu. MS access token'i
            //    Graph /me ile dogrular, kullaniciyi e-postadan bulur/olusturur,
            //    backend JWT (8h) doner. Sifreyle giris ile ayni token semasi.
            const msRoute =
              "app.post('/api/giris-ms', async (req, res) => { // giris-ms v1\n" +
              "  try {\n" +
              "    const jwt2 = require('jsonwebtoken');\n" +
              "    const https = require('https');\n" +
              "    const accessToken = (req.body && req.body.accessToken) || '';\n" +
              "    if (!accessToken) return res.status(400).json({ hata: 'Microsoft token gerekli' });\n" +
              "    const me = await new Promise((resolve, reject) => {\n" +
              "      const gr = https.request({ hostname: 'graph.microsoft.com', path: '/v1.0/me', method: 'GET', headers: { Authorization: 'Bearer ' + accessToken } }, (gres) => {\n" +
              "        let d = '';\n" +
              "        gres.on('data', c => d += c);\n" +
              "        gres.on('end', () => {\n" +
              "          if (gres.statusCode >= 200 && gres.statusCode < 300) { try { resolve(JSON.parse(d)); } catch (e) { reject(new Error('parse')); } }\n" +
              "          else reject(new Error('graph ' + gres.statusCode));\n" +
              "        });\n" +
              "      });\n" +
              "      gr.on('error', reject);\n" +
              "      gr.setTimeout(10000, () => gr.destroy(new Error('timeout')));\n" +
              "      gr.end();\n" +
              "    });\n" +
              "    const email = String(me.mail || me.userPrincipalName || '').toLowerCase().trim();\n" +
              "    if (!email) return res.status(401).json({ hata: 'E-posta alinamadi' });\n" +
              "    const ADMIN_EMAILS = ['selim@emon.com.tr'];\n" +
              "    let u = (await pool.query('SELECT * FROM kullanicilar WHERE lower(username)=$1 OR lower(email)=$1 LIMIT 1', [email])).rows[0];\n" +
              "    if (!u) {\n" +
              "      const rol = ADMIN_EMAILS.indexOf(email) >= 0 ? 'admin' : 'satici';\n" +
              "      u = (await pool.query('INSERT INTO kullanicilar (ad, username, email, rol, sifre, durum) VALUES ($1,$2,$3,$4,$5,$6) RETURNING *', [me.displayName || email, email, email, rol, '', 'Aktif'])).rows[0];\n" +
              "    }\n" +
              "    if (String(u.durum).toLowerCase() !== 'aktif') return res.status(403).json({ hata: 'Hesap pasif' });\n" +
              "    try { await pool.query('UPDATE kullanicilar SET son_giris=NOW() WHERE id=$1', [u.id]); } catch (e) {}\n" +
              "    const token = jwt2.sign({ id: u.id, username: u.username, rol: u.rol }, process.env.JWT_SECRET, { expiresIn: '8h' });\n" +
              "    res.json({ token, kullanici: { id: u.id, ad: u.ad, username: u.username, email: u.email, rol: u.rol, durum: u.durum, olusturma: u.olusturma } });\n" +
              "  } catch (e) {\n" +
              "    res.status(401).json({ hata: 'Microsoft dogrulama basarisiz: ' + (e.message || 'hata') });\n" +
              "  }\n" +
              "});\n";
            if (s.includes('// giris-ms v1')) {
              console.log('giris-ms route zaten var');
            } else if (s.includes("app.get('/api/saglik'")) {
              yedek();
              s = s.replace("app.get('/api/saglik'", msRoute + "\napp.get('/api/saglik'");
              degisti = true;
              console.log('giris-ms route eklendi');
            } else {
              console.log('UYARI: /api/saglik bulunamadi, giris-ms eklenemedi');
            }
            // 4) AI proxy — merkezi Claude key (.env CLAUDE_API_KEY) ile Anthropic'e
            //    sunucu uzerinden istek. Kullanicilar kendi key'ini girmez.
            const aiRoute =
              "app.post('/api/ai/messages', authMiddleware, async (req, res) => { // ai-proxy v1\n" +
              "  const key = process.env.CLAUDE_API_KEY;\n" +
              "  if (!key) return res.status(503).json({ hata: 'no-server-key' });\n" +
              "  try {\n" +
              "    const https = require('https');\n" +
              "    const payload = JSON.stringify(req.body || {});\n" +
              "    const up = await new Promise((resolve, reject) => {\n" +
              "      const ar = https.request({ hostname: 'api.anthropic.com', path: '/v1/messages', method: 'POST', headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'Content-Length': Buffer.byteLength(payload) } }, (ares) => {\n" +
              "        let d = '';\n" +
              "        ares.on('data', c => d += c);\n" +
              "        ares.on('end', () => resolve({ status: ares.statusCode, body: d }));\n" +
              "      });\n" +
              "      ar.on('error', reject);\n" +
              "      ar.setTimeout(180000, () => ar.destroy(new Error('timeout')));\n" +
              "      ar.write(payload);\n" +
              "      ar.end();\n" +
              "    });\n" +
              "    let data = null; try { data = JSON.parse(up.body); } catch (e) {}\n" +
              "    res.json({ status: up.status, data });\n" +
              "  } catch (e) {\n" +
              "    res.json({ status: 0, hata: 'proxy: ' + (e.message || 'hata') });\n" +
              "  }\n" +
              "});\n" +
              "app.get('/api/ai/durum', authMiddleware, (req, res) => { res.json({ proxy: !!process.env.CLAUDE_API_KEY }); }); // ai-proxy v1\n";
            if (s.includes('// ai-proxy v1')) {
              console.log('ai-proxy route zaten var');
            } else if (s.includes("app.get('/api/saglik'")) {
              yedek();
              s = s.replace("app.get('/api/saglik'", aiRoute + "\napp.get('/api/saglik'");
              degisti = true;
              console.log('ai-proxy route eklendi');
            } else {
              console.log('UYARI: /api/saglik bulunamadi, ai-proxy eklenemedi');
            }
            if (degisti) fs.writeFileSync(f, s); else console.log('server.js zaten guncel');
            PATCH
            node /tmp/emon-patch.js

      - name: Upload seeder
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "tools/seed-tedarikciler.js"
          target: "/var/www/emonfast/"
          strip_components: 1

      - name: Seed tedarikciler (yalnizca tablo bossa)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/emonfast
            node seed-tedarikciler.js

      - name: Set Claude API key in .env (secret varsa)
        uses: appleboy/ssh-action@master
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: CLAUDE_API_KEY
          script: |
            cd /var/www/emonfast
            if [ -n "$CLAUDE_API_KEY" ]; then
              touch .env
              if grep -q '^CLAUDE_API_KEY=' .env; then
                sed -i "s|^CLAUDE_API_KEY=.*|CLAUDE_API_KEY=$CLAUDE_API_KEY|" .env
              else
                echo "CLAUDE_API_KEY=$CLAUDE_API_KEY" >> .env
              fi
              echo ".env CLAUDE_API_KEY ayarlandi"
            else
              echo "CLAUDE_API_KEY secret yok, .env degismedi (proxy 503 doner, frontend yerel key'e duser)"
            fi

      - name: Rename and restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mv /var/www/emonfast/public/satin_alma_acentesi.html /var/www/emonfast/public/index.html
            cd /var/www/emonfast
            pm2 restart emonfast
